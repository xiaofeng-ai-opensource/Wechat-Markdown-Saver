<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <rect width="680" height="520" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="700" fill="#0f172a">授权状态机：什么情况下会「又要选一次」</text>
  <text x="24" y="52" font-size="11" fill="#64748b">方框 = 状态；箭头 = 转换条件；虚线 = 人工干预或迁移</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- persistent state -->
  <rect x="250" y="72" width="180" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="262" y="92" font-size="12" font-weight="700" fill="#14532d">持久授权</text>
  <text x="262" y="109" font-size="10.5" fill="#166534">Chrome 122+ 选「每次访问都允许」</text>

  <!-- states -->
  <rect x="30" y="150" width="160" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="44" y="174" font-size="12.5" font-weight="600" fill="#334155">未配置</text>
  <text x="44" y="192" font-size="10.5" fill="#64748b">没有凭证，也没有显示标记</text>

  <rect x="250" y="150" width="180" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="262" y="174" font-size="12.5" font-weight="600" fill="#14532d">已配置 · 授权有效</text>
  <text x="262" y="192" font-size="10.5" fill="#166534">granted：可直接写目录</text>

  <rect x="490" y="150" width="160" height="60" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="502" y="174" font-size="12.5" font-weight="600" fill="#991b1b">已配置 · 被拒</text>
  <text x="502" y="192" font-size="10.5" fill="#b91c1c">denied：需用户主动恢复</text>

  <rect x="250" y="280" width="180" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="262" y="304" font-size="12.5" font-weight="600" fill="#92400e">已配置 · 需重新授权</text>
  <text x="262" y="322" font-size="10.5" fill="#b45309">prompt：凭证在，许可没了</text>

  <rect x="30" y="280" width="160" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="44" y="304" font-size="12" font-weight="600" fill="#475569">历史遗留状态</text>
  <text x="44" y="322" font-size="10.5" fill="#64748b">凭证在，标记被误删</text>

  <!-- transitions -->
  <path d="M190,180 L244,180" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="196" y="140" font-size="10.5" fill="#475569">选文件夹（真人点击）</text>

  <path d="M340,150 L340,124" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="348" y="140" font-size="10.5" fill="#15803d">弹三选一并选持久项</text>

  <path d="M396,210 L396,276" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="404" y="246" font-size="10.5" fill="#b91c1c">浏览器回收授权</text>
  <text x="404" y="262" font-size="10" fill="#b91c1c">重启 / 会话结束 / 清数据 / 重载</text>

  <path d="M296,280 L296,214" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="196" y="246" font-size="10.5" fill="#15803d">真人点击重新授权成功</text>

  <path d="M430,296 L460,296 L460,182 L484,182" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="440" y="272" font-size="10.5" fill="#b91c1c">用户拒绝</text>

  <path d="M490,166 L436,166" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="440" y="132" font-size="10.5" fill="#15803d">再次授权成功</text>

  <path d="M190,310 L244,310" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="192" y="360" font-size="10.5" fill="#475569">迁移：自动补齐显示标记</text>

  <path d="M340,340 L340,404 L110,404 L110,214" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="352" y="398" font-size="10.5" fill="#64748b">手动点「清除」→ 回到未配置</text>

  <!-- note -->
  <rect x="20" y="430" width="640" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="452" font-size="11.5" font-weight="600" fill="#334155">浏览器规则（不能靠代码绕过）</text>
  <text x="36" y="470" font-size="11" fill="#475569">授权记的是「来源 + 目录 + 读写」关系，与文件夹是否存在无关；最后一个页面关闭后即可被收回。</text>
  <text x="36" y="488" font-size="11" fill="#475569">重新申请权限必须由真人点击触发，后台隐藏页面无法代替；因此「长期可用」的上限是：持久授权一次，或失效后点一次授权。</text>
</svg>
