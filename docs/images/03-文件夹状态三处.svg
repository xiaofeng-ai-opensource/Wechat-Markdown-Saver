<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
<title>图 3 文件夹相关的三处状态</title>
<desc>显示标记、文件夹凭证、写入许可分别存在哪里，谁读写，以及失败时各自的变化。</desc>
<text x="40" y="30" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">图 3 · 文件夹相关的三处状态</text>

<rect x="40" y="52" width="190" height="196" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="135" y="76" text-anchor="middle" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#0C447C">A 显示标记</text>
<text x="56" y="104" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">存在：chrome.storage.local</text>
<text x="56" y="128" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">内容：folderName</text>
<text x="56" y="148" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">　　　folderSet</text>
<text x="56" y="176" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">读者：弹窗顶部、设置页</text>
<text x="56" y="204" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">失败时：被代码删掉</text>
<text x="56" y="230" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">只影响界面文字</text>

<rect x="245" y="52" width="190" height="196" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="76" text-anchor="middle" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#085041">B 文件夹凭证</text>
<text x="261" y="104" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">存在：IndexedDB</text>
<text x="261" y="128" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">内容：dirHandle 句柄</text>
<text x="261" y="148" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">　　　库 wechat-md-saver</text>
<text x="261" y="176" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">读者：隐藏页面、后台服务</text>
<text x="261" y="204" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">失败时：原封不动保留</text>
<text x="261" y="230" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">写入时真正要用</text>

<rect x="450" y="52" width="190" height="196" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="545" y="76" text-anchor="middle" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#633806">C 写入许可</text>
<text x="466" y="104" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">存在：浏览器权限系统</text>
<text x="466" y="128" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">内容：是否允许读写目录</text>
<text x="466" y="148" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">　　　扩展存不了也备份不了</text>
<text x="466" y="176" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">读者：只有浏览器自己</text>
<text x="466" y="204" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">失效：会话结束、后台回收</text>
<text x="466" y="230" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">　　　或用户手动撤销</text>

<rect x="40" y="272" width="600" height="56" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">保存主流程只依赖 B + C，完全不读 A</text>

<text x="40" y="356" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">所以删掉 A 只改变界面上那行字，不改变能否写进文件夹；</text>
<text x="40" y="378" font-family="system-ui, Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">重新拿到 C 必须由真人点击一次，隐藏页面无法自己完成。</text>
</svg>
